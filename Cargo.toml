[package]
name = "log-fft"
version = "0.1.3"
edition = "2024"
rust-version = "1.85"
description = "Exact FFT/NTT over the Goldilocks field (any length dividing p-1, chirp-z and its inverse, abelian-group DFTs), plus executable building blocks of the 2026 'logarithmic exponent of finite Fourier transforms' construction"
license = "MIT OR Apache-2.0"
readme = "README.md"
documentation = "https://docs.rs/log-fft"
repository = "https://github.com/Gilfeather/log-fft"
keywords = ["fft", "ntt", "dft", "goldilocks", "chirp-z"]
categories = ["algorithms", "mathematics", "cryptography", "no-std"]
exclude = [".github"]

[features]
default = ["std"]
# Threads for large transforms, and the `paper` module (which uses `f64` math).
std = []

[dependencies]

[profile.test]
opt-level = 3
debug-assertions = true
overflow-checks = true

[[example]]
name = "paper_demo"
required-features = ["std"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
